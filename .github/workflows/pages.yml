name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    # refresh.yml commits with the default GITHUB_TOKEN, and GitHub doesn't
    # let a token-authored push trigger other workflows (loop protection),
    # so the "push" trigger above never fires for those commits. This one
    # catches it instead, once the refresh run itself finishes.
    workflows: ["Refresh company financials and rebuild site", "Discover companies for unmapped business codes"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
