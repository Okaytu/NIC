name: Check for broken company links

on:
  schedule:
    - cron: "0 5 * * *"   # daily ~05:00 UTC, cheap (HEAD/GET only, no parsing)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python3 scripts/precheck.py
      - name: Commit if the broken-link list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/broken_links.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Broken-link check: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
