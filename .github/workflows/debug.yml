name: Debug Wikipedia/EDGAR discovery lookups

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Run diagnostic
        run: PYTHONPATH=scripts python3 scripts/debug_wiki_test.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/debug_wiki_test.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Debug: wiki/edgar discovery diagnostic output"
            git push
          fi
