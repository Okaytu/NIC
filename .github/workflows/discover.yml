name: Discover companies for unmapped business codes

on:
  schedule:
    - cron: "33 4 1,15 * *"   # 1st and 15th of each month -- heavier/noisier than refresh, so less frequent
  workflow_dispatch:
    inputs:
      limit:
        description: "How many empty NIC codes to process this run"
        required: false
        default: "20"
      section:
        description: "Limit to one section letter (blank = any)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: discover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Find and verify candidate companies
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '20' }}"
          if [ -n "${{ github.event.inputs.section }}" ]; then ARGS="$ARGS --section ${{ github.event.inputs.section }}"; fi
          python3 scripts/discover.py $ARGS

      - name: Regenerate section data files
        run: python3 scripts/gen_all.py

      - name: Rebuild site/index.html
        run: python3 scripts/build_site.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies.json data/financials.json data/discovery_queue.json data/map_*.json site/data_*.js site/index.html
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Automated discovery run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A long discovery run can easily overlap someone else pushing to
          # main (this repo saw exactly that during development -- the job
          # ran fine but lost its results because the final push was a
          # plain non-fast-forward rejection with no retry). Rebase onto
          # whatever's new on origin and retry a few times instead of
          # failing outright and losing a whole run's discoveries.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main || { echo "rebase conflict -- giving up, not overwriting remote"; git rebase --abort; exit 1; }
            sleep 5
          done
          echo "push still failing after 5 attempts"
          exit 1
